<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      text{font-family:Arial,sans-serif}.title{font-size:26px;font-weight:700;fill:#172033}.subtitle{font-size:14px;fill:#526076}
      .group{fill:none;stroke:#9aa5b1;stroke-width:1}.group-title{font-size:16px;font-weight:700;fill:#26364d}
      .head{fill:#263f60;stroke:#263f60}.body{fill:#fff;stroke:#536170;stroke-width:1.2}
